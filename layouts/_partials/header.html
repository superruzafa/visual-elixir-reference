<header class="site-header">
  <div class="site-header__bar">
    <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-expanded="false" aria-controls="sidebar-nav">
      <span class="sidebar-toggle__icon" aria-hidden="true"></span>
      <span class="sr-only">Toggle navigation</span>
    </button>
    <a class="logo" href="{{ $.Site.Home.Permalink }}/">
      <span>{{ $.Site.Title }}</span>
    </a>
    <div class="searchbox">
      <input id="searchbox-input" class="searchbox__input" type="search" autocomplete="off" placeholder="Search functions…">
      <ul id="search-results" class="search-results">
      </ul>
    </div>
    <div class="theme-switch" id="theme-switch" role="group" aria-label="Theme">
      <button type="button" class="theme-switch__option" data-theme-value="light" aria-pressed="false" title="Light">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"></path></svg>
        <span class="sr-only">Light</span>
      </button>
      <button type="button" class="theme-switch__option" data-theme-value="dark" aria-pressed="false" title="Dark">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
        <span class="sr-only">Dark</span>
      </button>
      <button type="button" class="theme-switch__option" data-theme-value="system" aria-pressed="true" title="System">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="14" rx="2"></rect><path d="M8 21h8M12 17v4"></path></svg>
        <span class="sr-only">System</span>
      </button>
    </div>
  </div>
</header>
<template id="search-result-template">
  <li class="search-result__item">
    <a>
      <div class="search-result__function"></div>
      <div class="search-result__module"></div>
    </a>
  </li>
</template>
<script>
    const functions = [
{{ range where $.Site.RegularPages ".Draft" false -}}
        { "module": {{ .Parent.Title }}, "function": {{ .Title }}, "url": {{ .RelPermalink }} },
{{ end }}
    ];
  new Search(functions);
</script>
