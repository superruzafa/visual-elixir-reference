<header class="site-header">
  <div class="site-header__bar">
    <button type="button" class="sidebar-toggle" id="sidebar-toggle" aria-expanded="false" aria-controls="sidebar-nav">
      <span class="sidebar-toggle__icon" aria-hidden="true"></span>
      <span class="sr-only">Toggle navigation</span>
    </button>
    <a class="logo" href="{{ $.Site.Home.Permalink }}/">
      <span>{{ $.Site.Title }}</span>
    </a>
    <div class="searchbox">
      <input id="searchbox-input" class="searchbox__input" type="search" autocomplete="off" placeholder="Search functions…">
      <ul id="search-results" class="search-results">
      </ul>
    </div>
  </div>
</header>
<template id="search-result-template">
  <li class="search-result__item">
    <a>
      <div class="search-result__function"></div>
      <div class="search-result__module"></div>
    </a>
  </li>
</template>
<script>
    const functions = [
{{ range where $.Site.RegularPages ".Draft" false -}}
        { "module": {{ .Parent.Title }}, "function": {{ .Title }}, "url": {{ .RelPermalink }} },
{{ end }}
    ];
  new Search(functions);
</script>
