<!doctype html>
<html lang="{{ site.Language.Lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{{ block "title" . }}{{ end }}</title>
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('theme');
        if (stored === 'light' || stored === 'dark') {
          document.documentElement.setAttribute('data-theme', stored);
        }
      } catch (e) {}
    })();
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cabin:ital@0;1&family=Inconsolata&display=swap" rel="stylesheet">
  {{ partial "css.html" . }}
  <script src="{{ "scripts/fuse.min.js" | relURL }}"></script>
  <script src="{{ "scripts/search.js" | relURL }}"></script>
</head>
<body>
  {{ partial "header.html" . }}
  <div class="layout">
    {{ partial "sidebar.html" . }}
    <div class="sidebar-backdrop" id="sidebar-backdrop"></div>
    <main class="content" id="main-content">
      {{ block "main" . }}{{ end }}
    </main>
  </div>
  <script src="{{ "scripts/sidebar.js" | relURL }}" defer></script>
  <script src="{{ "scripts/theme.js" | relURL }}" defer></script>
</body>
</html>
